# xxxx-start/src/main/resources/application-dev.yaml
server:
  port: 1122
  servlet:
    context-path: /api

spring:
  application:
    name: school-asset-management

  datasource:
    url: jdbc:mysql://localhost:33006/school_db?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000

  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  # ✅ REDIS CONFIGURATION (vì Redis container đã chạy không password)
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 2000ms
      connect-timeout: 2000ms

      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 2000ms
        shutdown-timeout: 100ms

  # ✅ CACHE CONFIGURATION với Redis
  cache:
    type: redis
    redis:
      cache-null-values: false
      time-to-live: 1800000 # 30 minutes
      key-prefix: "school:cache:"
      use-key-prefix: true

# JWT Configuration
app:
  security:
    jwt:
      secret: mySecretKey123456789012345678901234567890123456789012345678901234567890
      expiration: 86400 # 24 hours
      refresh-expiration: 604800 # 7 days
    max-login-attempts: 5
    password-expiry-days: 90

  business:
    user:
      min-username-length: 3
      max-username-length: 50

# Logging Configuration
logging:
  level:
    root: INFO
    school.xxxx: DEBUG
    org.springframework.security: WARN
    org.springframework.data.redis: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,redis
  endpoint:
    health:
      show-details: always
    redis:
      enabled: true