# xxxx-start/src/main/resources/application-dev.yaml (Fixed Version)
server:
  port: 1122
  servlet:
    context-path: /api

spring:
  application:
    name: school-asset-management

  datasource:
    url: jdbc:mysql://localhost:33006/school_db?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000

  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: true
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  # Redis Configuration (Optional - comment out if not using Redis)
  # data:
  #   redis:
  #     host: localhost
  #     port: 6379
  #     password:
  #     database: 0

  # Cache Configuration
  cache:
    type: simple # Use simple cache instead of redis for development

# JWT Configuration
app:
  security:
    jwt:
      secret: mySecretKey123456789012345678901234567890123456789012345678901234567890
      expiration: 86400 # 24 hours
      refresh-expiration: 604800 # 7 days
    max-login-attempts: 5
    password-expiry-days: 90

  business:
    user:
      min-username-length: 3
      max-username-length: 50

# Logging Configuration
logging:
  level:
    root: INFO
    school.xxxx: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always